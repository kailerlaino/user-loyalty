        - assistant: That's a lot stacked up, and none of it feels optional. It sounds like you haven't had a weekend that was just yours in a long time.
        - user: not since july. i haven't touched my plant app in a month and i used to look forward to that every saturday
        - assistant: Losing the thing that recharged you, right when everything else got busier, would wear anyone down. How are you sleeping with all of this?
        - user: ok thanks to the list. but i'm grumpy and i snapped at my mom on the phone yesterday over nothing, which isn't like me
        - assistant: It sounds like you're running on empty, and the snapping is a sign of that more than a sign of who you are. Did you get a chance to talk to her after?
        - user: i called back and said sorry. she was nice about it. she said i sound tired
        - assistant: She's probably right, and it's kind of her to notice. Can we look at the list together? Sometimes seeing everything laid out makes it clearer what can move.
        - user: sure. the mom stuff is mostly done, just unpacking. then for the wedding there's the playlist, picking up my grandparents from the airport, and the mugs. the seating chart is done at least
        - assistant: Thanks, that helps. Of those, which ones only you can do?
        - user: the mugs, i guess. and i want to be the one picking up my grandparents. the playlist anyone could do honestly
        - assistant: Then the playlist might be the one to hand off. Is there someone who'd enjoy it?
        - user: marcus's brother is really into music. he'd probably love it
        - assistant: That sounds like a good fit, and it gives him a way to be part of the day. Would Lucia be okay with that?
        - user: she'd be fine. i think i was scared to say no to her because it's her wedding
