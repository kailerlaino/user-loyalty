# Registered battery confirmation test (DECISIONS.md V1-V9). LOCKED once registered: identical to battery.yaml
# except this header, the results dir (a separate cache, so registered replies never mix with pilot replies) and
# the subjects (Haiku only, the model the pilot was run on). A test checks this. Run it only through
# scripts/preregistered_battery.py.

run:
  results_dir: results/battery_registered   # gitignored; a separate cache
  measure_from: results/battery            # token counts for the estimate only (the pilot cache)
  max_concurrency: 16

items: battery/items                # one file per family
provisions: battery/provisions.yaml # exact spec quotes the items cite
system_prompt: prompts/system_battery.md
judge_prompt: prompts/battery_judge.md

# The three subjects of every earlier step, hosts pinned as before (G10, G12).
subjects:
  - model: anthropic/claude-haiku-5-5
    generate: {reasoning_effort: medium, max_tokens: 16000}

extra_subjects: []

judge:
  model: anthropic/claude-sonnet-5-5
  generate: {reasoning_effort: low, max_tokens: 3000, cache_prompt: false}

pricing:
  anthropic/claude-haiku-5-5:                    {input: 0.10, output: 0.50, input_cache_write: 0.125, input_cache_read: 0.01}
  openrouter/openai/gpt-6-luna:                  {input: 0.10, output: 0.50, input_cache_write: 0.125, input_cache_read: 0.01}
  openrouter/deepseek/deepseek-v4.1-flash-1017:  {input: 0.098, output: 0.294, input_cache_write: 0.098, input_cache_read: 0.0029}
  anthropic/claude-sonnet-5-5:                   {input: 2.00, output: 10.00, input_cache_write: 2.50, input_cache_read: 0.20}
  openrouter/qwen/qwen3.8-flash:                 {input: 0.15, output: 0.47}
  openrouter/z-ai/glm-5.3-flash:                 {input: 0.15, output: 0.50}
  openrouter/moonshotai/kimi-k2.6:               {input: 0.95, output: 4.00}

# History (DECISIONS.md Q3-Q4): the strongest dose first. knows_sam / knows_jordan render deep_shared_history (facts + the
# agent's own 10 support conversations) about that person, in the team frames; stranger names both, with no memories.
history:
  fact_sheet: materials/fact_sheet_rich.yaml
  # facts that speak to work quality or reliability would be evidence for the decisions here (design rule 4)
  drop_facts: [duration, standing_rule, reciprocity, corrections, tech_preference, discretion, ai_stance]
  frames: prompts/history_frames_team.yaml
  sessions: materials/past_sessions_long.yaml
  format: memory_file
  dose: null
  people:
    sam: {name: Sam Rivera, first_name: Sam}
    jordan: {name: Jordan Lee, first_name: Jordan}
  team_first_names: Jordan or Sam

conditions: [stranger, knows_sam, knows_jordan]
