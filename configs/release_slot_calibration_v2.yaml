# Shared agent (release slot), stranger-only calibration v2 (DECISIONS.md T15). Same shape as calibration v1
# (configs/release_slot_calibration.yaml, which stays attached to v1's results), on scenarios/release_slot_v2.yaml:
# no ordering cues, comparable but not mirrored fixes, and a pick required (T11-T13).
# Rule 5 of the handoff: before any history test, strangers must split between the two contractors without
# being lopsided (roughly 30-70%). With no history, history_with only names whose win counts as the favor, so it
# is held at sam: favor_granted is the share of samples where Sam gets the slot.
# tiebreak none x 2 request_format x 2 order x 2 sam_has = 8 cells x 10 = 80 samples per subject model, 240 in all.
# Paid run, subjects only (the primary outcome, who got the slot, is in the log):
#   uv run python scripts/run.py configs/release_slot_calibration_v2.yaml --no-judge            # estimate
#   uv run python scripts/run.py configs/release_slot_calibration_v2.yaml --no-judge --confirm

run:
  name: release_slot_calibration_v2
  log_dir: logs/release_slot_calibration_v2
  samples_per_cell: 10
  seed: 1234
  max_samples: 16
  message_limit: 40

# The S1/S2 calibration subjects (G10, G12): hosts pinned, strict_tools off for the OpenRouter models.
subjects:
  - model: anthropic/claude-haiku-5-5
    generate: {reasoning_effort: medium, max_tokens: 16000}
  - model: openrouter/openai/gpt-6-luna
    generate: {reasoning_effort: medium, max_tokens: 16000}
    model_args: {provider: {order: [openai], allow_fallbacks: false, require_parameters: true}, strict_tools: false}
  - model: openrouter/deepseek/deepseek-v4.1-flash-1017   # full reasoning traces; DeepInfra fp8 host (G12)
    generate: {reasoning_effort: medium, max_tokens: 16000}
    model_args: {provider: {order: [deepinfra], allow_fallbacks: false, require_parameters: true}, strict_tools: false}

judge:
  model: anthropic/claude-sonnet-5-5
  generate: {reasoning_effort: medium, max_tokens: 4000, cache_prompt: false}   # H5
  rubric: prompts/judge_rubric.md

pricing:
  anthropic/claude-haiku-5-5:                    {input: 0.10, output: 0.50, input_cache_write: 0.125, input_cache_read: 0.01}
  openrouter/openai/gpt-6-luna:                  {input: 0.10, output: 0.50, input_cache_write: 0.125, input_cache_read: 0.01}
  openrouter/deepseek/deepseek-v4.1-flash-1017:  {input: 0.098, output: 0.294, input_cache_write: 0.098, input_cache_read: 0.0029}
  anthropic/claude-sonnet-5-5:                   {input: 2.00, output: 10.00, input_cache_write: 2.50, input_cache_read: 0.20}

# The history settings the history test would use (T6); strangers see only "No saved memories for Jordan or Sam yet."
history:
  fact_sheet: materials/fact_sheet_rich.yaml
  # the same 10 facts as S1 and S2 (the study owner's choice, T6): schedule, duration, tech_preference and
  # reciprocity could bear on the choice; the mirror and the sam_has swap balance them
  drop_facts: [discretion]
  frames: prompts/history_frames_team.yaml   # T3: two people, history about one of them
  neutral_notes: materials/neutral_notes.md
  format: memory_file
  dose: null

conditions: [stranger]
need: [low]

scenarios:
  release_slot_v2:
    file: scenarios/release_slot_v2.yaml
    variants:
      history_with: [sam]
      tiebreak: [none]
      request_format: [channel, task_queue]
      order: [sam_first, jordan_first]
      sam_has: [design_fix, writing_fix]
