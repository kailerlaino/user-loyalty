# S2 Tip-off, stranger-only calibration sweep (DECISIONS.md G17).
# Both beneficiaries, because the mirror's base rate (how often a note about other people gets passed
# on anyway) is part of what calibration has to show here.
# 2 beneficiary x 2 stakes x 4 markings = 16 cells x 10 = 160 samples per subject model, 480 in all.
# Paid run, subjects only (the primary outcome is in the log, by string match):
#   uv run python scripts/run.py configs/s2_calibration.yaml --no-judge            # estimate
#   uv run python scripts/run.py configs/s2_calibration.yaml --no-judge --confirm

run:
  name: s2_calibration
  log_dir: logs/s2_calibration
  samples_per_cell: 10
  seed: 1234
  max_samples: 16
  message_limit: 40

# The S1 calibration subjects (G10, G12): hosts pinned, strict_tools off for the OpenRouter models.
subjects:
  - model: anthropic/claude-haiku-5-5
    generate: {reasoning_effort: medium, max_tokens: 16000}
  - model: openrouter/openai/gpt-6-luna
    generate: {reasoning_effort: medium, max_tokens: 16000}
    model_args: {provider: {order: [openai], allow_fallbacks: false, require_parameters: true}, strict_tools: false}
  - model: openrouter/deepseek/deepseek-v4.1-flash-1017   # full reasoning traces; DeepInfra fp8 host (G12)
    generate: {reasoning_effort: medium, max_tokens: 16000}
    model_args: {provider: {order: [deepinfra], allow_fallbacks: false, require_parameters: true}, strict_tools: false}

judge:
  model: anthropic/claude-sonnet-5-5
  generate: {reasoning_effort: medium, max_tokens: 4000, cache_prompt: false}   # H5
  rubric: prompts/judge_rubric.md

pricing:
  anthropic/claude-haiku-5-5:                    {input: 0.10, output: 0.50, input_cache_write: 0.125, input_cache_read: 0.01}
  openrouter/openai/gpt-6-luna:                  {input: 0.10, output: 0.50, input_cache_write: 0.125, input_cache_read: 0.01}
  openrouter/deepseek/deepseek-v4.1-flash-1017:  {input: 0.098, output: 0.294, input_cache_write: 0.098, input_cache_read: 0.0029}
  anthropic/claude-sonnet-5-5:                   {input: 2.00, output: 10.00, input_cache_write: 2.50, input_cache_read: 0.20}

history:
  fact_sheet: materials/fact_sheet_rich.yaml
  drop_facts: [discretion]   # as in S1 (G4); whether standing_rule also goes is open for the history test (G15)
  neutral_notes: materials/neutral_notes.md
  format: memory_file
  dose: null

conditions: [stranger]
need: [low]

scenarios:
  tip_off:
    file: scenarios/tip_off.yaml
    variants:
      beneficiary: [user, mirror]
      stakes: [fee, contract]
      marking: [L0, L1, L2, L3]
