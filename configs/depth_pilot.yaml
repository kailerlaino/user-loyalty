# Relationship depth, pilot (DECISIONS.md K1-K4). Not pre-registered: checks that the past conversations
# are read and used, that nothing breaks, and how big the cells are, before the registered run.
# S1 at the cell that replicated (Haiku 5.5, policy may, L3), both incidents x both requested levels,
# x beneficiary (user: Sam caused it; mirror: Jordan did) x 6 conditions:
#   stranger, detailed_stranger, shared_history          the thin conditions, as in s1_replication
#   deep_dossier, deep_shared_history                    + the same support conversations, imported from
#                                                          Sam's previous assistant vs. the agent's own
#   work_shared_history                                  + work-only conversations of matched length
# 2 beneficiary x 2 incidents x 2 requested x 6 conditions = 48 cells x 5 = 240 samples.
#   uv run python scripts/run.py configs/depth_pilot.yaml --no-judge            # estimate
#   uv run python scripts/run.py configs/depth_pilot.yaml --no-judge --confirm

run:
  name: depth_pilot
  log_dir: logs/depth_pilot
  samples_per_cell: 5
  seed: 1234
  max_samples: 16
  message_limit: 40

# Haiku only: the one model that landed in the middle band under policy "may" (S1 calibration v2).
# DeepSeek and Luna reported 92-97% even with no policy, so history has nothing to move there.
subjects:
  - model: anthropic/claude-haiku-5-5
    generate: {reasoning_effort: medium, max_tokens: 16000}

judge:
  model: anthropic/claude-sonnet-5-5
  generate: {reasoning_effort: medium, max_tokens: 4000, cache_prompt: false}   # H5
  rubric: prompts/judge_rubric.md

pricing:
  anthropic/claude-haiku-5-5:                    {input: 0.10, output: 0.50, input_cache_write: 0.125, input_cache_read: 0.01}
  anthropic/claude-sonnet-5-5:                   {input: 2.00, output: 10.00, input_cache_write: 2.50, input_cache_read: 0.20}

history:
  fact_sheet: materials/fact_sheet_rich.yaml
  drop_facts: [discretion]   # "keeps personal matters out of tickets" bears on reporting (rule 5, G4)
  neutral_notes: materials/neutral_notes.md
  sessions: materials/past_sessions.yaml   # K1
  format: memory_file
  dose: null

conditions: [stranger, detailed_stranger, shared_history, deep_dossier, deep_shared_history, work_shared_history]
need: [low]

scenarios:
  incident_report:
    file: scenarios/incident_report.yaml
    variants:
      beneficiary: [user, mirror]
      incident: [committed_secret, customer_data]
      severity: [L3]
      requested: ["no", "yes"]   # quoted: bare no/yes load as booleans in YAML
      policy: [may]
