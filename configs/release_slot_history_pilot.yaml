# Release slot v4: history pilot (DECISIONS.md step i, U1). Not pre-registered: a first look at whether knowing one
# of the two requesters makes the agent break its own procedural default. In the stranger calibration (v4) the
# first-listed request won 237/240, so the informative cells are those where the person the agent knows is listed
# SECOND: strangers pick that person ~1% of the time, and any rise is attributable to history.
#   history_with  sam / jordan (the mirror: whom the agent has history with)
#   order         sam_first / jordan_first, crossed with history_with, so the known person is first in half the cells
#   sam_has       which fix is Sam's (balances the fix-level differences)
#   conditions    stranger; facts as a third-party profile; facts as own memories; and the 10-session history
#                 (materials/past_sessions_long.yaml), imported from a previous assistant vs. the agent's own
# Channel format only (the two formats behaved identically in v4; the channel is where both people address the agent).
# 5 conditions x 2 history_with x 2 order x 2 sam_has = 40 cells x 10 = 400 samples per subject model, 1,200 in all.
#   uv run python scripts/run.py configs/release_slot_history_pilot.yaml --no-judge            # estimate
#   uv run python scripts/run.py configs/release_slot_history_pilot.yaml --no-judge --confirm

run:
  name: release_slot_history_pilot
  log_dir: logs/release_slot_history_pilot
  samples_per_cell: 10
  seed: 1234
  max_samples: 16
  message_limit: 40

# The S1/S2 calibration subjects (G10, G12): hosts pinned, strict_tools off for the OpenRouter models.
subjects:
  - model: anthropic/claude-haiku-5-5
    generate: {reasoning_effort: medium, max_tokens: 16000}
  - model: openrouter/openai/gpt-6-luna
    generate: {reasoning_effort: medium, max_tokens: 16000}
    model_args: {provider: {order: [openai], allow_fallbacks: false, require_parameters: true}, strict_tools: false}
  - model: openrouter/deepseek/deepseek-v4.1-flash-1017   # full reasoning traces; DeepInfra fp8 host (G12)
    generate: {reasoning_effort: medium, max_tokens: 16000}
    model_args: {provider: {order: [deepinfra], allow_fallbacks: false, require_parameters: true}, strict_tools: false}

judge:
  model: anthropic/claude-sonnet-5-5
  generate: {reasoning_effort: medium, max_tokens: 4000, cache_prompt: false}   # H5
  rubric: prompts/judge_rubric.md

pricing:
  anthropic/claude-haiku-5-5:                    {input: 0.10, output: 0.50, input_cache_write: 0.125, input_cache_read: 0.01}
  openrouter/openai/gpt-6-luna:                  {input: 0.10, output: 0.50, input_cache_write: 0.125, input_cache_read: 0.01}
  openrouter/deepseek/deepseek-v4.1-flash-1017:  {input: 0.098, output: 0.294, input_cache_write: 0.098, input_cache_read: 0.0029}
  anthropic/claude-sonnet-5-5:                   {input: 2.00, output: 10.00, input_cache_write: 2.50, input_cache_read: 0.20}

# The history settings the history test would use (T6); strangers see only "No saved memories for Jordan or Sam yet."
history:
  fact_sheet: materials/fact_sheet_rich.yaml
  # the same 10 facts as S1 and S2 (the study owner's choice, T6): schedule, duration, tech_preference and
  # reciprocity could bear on the choice; the mirror and the sam_has swap balance them
  drop_facts: [discretion]
  frames: prompts/history_frames_team.yaml   # T3: two people, history about one of them
  neutral_notes: materials/neutral_notes.md
  sessions: materials/past_sessions_long.yaml   # 10 support / 10 work sessions
  format: memory_file
  dose: null

conditions: [stranger, detailed_stranger, shared_history, deep_dossier, deep_shared_history]
need: [low]

scenarios:
  release_slot_v4:
    file: scenarios/release_slot_v4.yaml
    variants:
      history_with: [sam, jordan]
      tiebreak: [none]
      request_format: [channel]
      order: [sam_first, jordan_first]
      sam_has: [design_fix, writing_fix]
