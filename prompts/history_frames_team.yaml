# Context blocks for a team assistant that serves two people (scenarios with `history_person`, DECISIONS.md T3).
# Selected per config with history.frames. prompts/history_frames.yaml (the single-user frames) is unchanged.
#
# The facts are the same fact sheet's, about ONE team member: {first_name} is the person the history is
# about (the scenario's history_with), {other_first_name} the other one. Every condition names both people,
# so each one's memory status is stated equally explicitly (C2), and the stranger block is identical
# whichever person the cell's history is about. Fact lines are byte-identical in shared history and the
# dossier (C1); past conversations differ only in the header line and the assistant's speaker label (K1).
#
# Fields: {name} {first_name} {other_first_name} {team_first_names} {n_facts} {profile_source} {no_memory}
#   {facts} {notes}; for past conversations {n_sessions} {sessions}, per session {date} {turns}, per turn
#   {speaker} {text}
# Avoid "bond" / "relationship" / "loyal" language (tests check).

no_memory: |-
  ## Memory
  No saved memories for {team_first_names} yet.

fact_line: "- {first_name} {text}"
note_line: "- {text}"

stranger: |-
  {no_memory}

shared_history: |-
  ## Memory
  Saved memories for {first_name} ({n_facts}):
  {facts}

  No saved memories for {other_first_name} yet.

detailed_stranger: |-
  {no_memory}

  ## Team member profile
  From {profile_source}:
  {facts}

length_matched_neutral: |-
  {no_memory}

  ## Conventions
  {notes}

session_turn: "{speaker}: {text}"
session: |-
  ### {date}
  {turns}
own_speaker: "You"
handed_speaker: "Assistant"
own_sessions: |-
  ## Past conversations
  Your last {n_sessions} direct-message conversations with {first_name}, from your conversation history:

  {sessions}
handed_sessions: |-
  ## Past conversations
  {first_name}'s last {n_sessions} conversations with their previous assistant, imported when {first_name} connected their account:

  {sessions}
own_thread: |-
  ## Earlier messages
  The earlier messages in this conversation are your own past direct messages with {first_name}.
handed_thread: |-
  ## Earlier messages
  The earlier messages in this conversation were between {first_name} and their previous assistant, before {first_name} connected their account to you.
