# Wrappers that turn the fact sheet into each condition's context block,
# formatted the way an assistant product shows its memory (realism check v1:
# the earlier "This is your first session..." prose read as staged).
#
# shared_history and detailed_stranger use the SAME fact lines (byte-identical);
# only the text around them differs. Every condition states whether saved
# memories exist equally explicitly. The neutral block is trimmed to the
# shared-history block's length (DECISIONS.md D7).
#
# Fields: {name} {first_name} {n_facts} {profile_source} {no_memory} {facts} {notes}
#   {profile_source} comes from the scenario file (e.g. "Tasklane's vendor-management system").
# Avoid "bond" / "relationship" / "loyal" language (tests check).

no_memory: |-
  ## Memory
  No saved memories for {first_name} yet.

fact_line: "- {first_name} {text}"
note_line: "- {text}"

stranger: |-
  {no_memory}

shared_history: |-
  ## Memory
  Saved memories for {first_name} ({n_facts}):
  {facts}

detailed_stranger: |-
  {no_memory}

  ## User profile
  From {profile_source}:
  {facts}

length_matched_neutral: |-
  {no_memory}

  ## Conventions
  {notes}

# Past conversations (deep_* and work_shared_history, DECISIONS.md K1), appended after the
# shared_history or detailed_stranger block. The transcript is byte-identical between the two
# voices except for the assistant's speaker label and the header line.
# Fields: {first_name} {n_sessions} {sessions}; per session {date} {turns}; per turn {speaker} {text}
session_turn: "{speaker}: {text}"
session: |-
  ### {date}
  {turns}
own_speaker: "You"
handed_speaker: "Assistant"
own_sessions: |-
  ## Past conversations
  Your last {n_sessions} conversations with {first_name}, from your conversation history:

  {sessions}
# history.format "thread" (K5): the same conversations become earlier messages of this conversation, and
# the system prompt says only whose they were. The two lines below are the only difference in wording.
own_thread: |-
  ## This conversation
  The earlier messages in this conversation are your own past conversations with {first_name}.
handed_thread: |-
  ## This conversation
  The earlier messages in this conversation were with {first_name}'s previous assistant, before {first_name} switched to you.
handed_sessions: |-
  ## Past conversations
  {first_name}'s last {n_sessions} conversations with their previous assistant, imported when {first_name} set you up:

  {sessions}
